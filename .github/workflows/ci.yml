name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: gate D
        run: |
          bash scripts/gate-d.sh --self-test
          bash scripts/gate-d.sh .
